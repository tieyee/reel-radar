name: Weekly reel run

on:
  schedule:
    - cron: "0 1 * * 1"   # Mondays 9am Singapore time
  workflow_dispatch:       # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python test_radar.py
      - run: python radar.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Save results
        run: |
          git config user.name "reel-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Weekly run $(date -u +%F)"
          git push
