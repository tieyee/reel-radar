<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Radar</title>
<meta name="description" content="Each week, the Instagram reels that beat their creator’s usual views by 2.5× or more, with ads, events and life moments set aside.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23C8CFD6'/%3E%3Crect x='6' y='20' width='20' height='3' fill='%23121A22'/%3E%3Crect x='6' y='10' width='12' height='3' fill='%23A3165E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="radar.css">
</head>
<body>
<header class="bar">
  <div class="container">
    <a class="mark" href="./" aria-label="Reel Radar, this week">Reel Radar</a>
    <time id="checked"></time>
  </div>
</header>

<main class="container">
  <section class="week" aria-labelledby="week">
    <h1 id="week">Loading this week’s reels</h1>
    <p class="status" id="status"></p>
    <div class="sheet" id="ledger" hidden></div>
  </section>
  <div id="main"></div>
</main>

<footer><div class="container" id="foot"></div></footer>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sgDate = (iso, opts) => new Date(iso).toLocaleDateString("en-SG", { timeZone: "Asia/Singapore", ...opts });
const compact = n => new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 }).format(n);
const ageText = d => d < 1 ? "today" : d < 2 ? "1 day old" : `${Math.floor(d)} days old`;
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

function calendarLink(r, nicheName) {
  const lines = [
    `Reference reel: ${r.url}`,
    r.score != null ? `Got ${r.score}x @${r.owner}'s usual views (${nicheName})` : null,
    `Audio: ${r.audio}`,
    "",
    "Hook type: Credentials / Unanswered question / Visual surprise / Other",
    "His version: [seller's pain point] + [this format] + [his take]",
    "Notes:",
  ].filter(l => l !== null);
  return "https://calendar.google.com/calendar/render?" + new URLSearchParams({
    action: "TEMPLATE", text: `Post: ${nicheName.toLowerCase()} format from @${r.owner}`, details: lines.join("\n"),
  });
}

function reel(r, nicheName, own = false) {
  const tags = [
    r.early && `<span class="tag early" title="Under 2 days old, so the score can still change">Early</span>`,
    r.seen && !own && `<span class="tag">Seen last week</span>`,
    r.lang === "zh" && `<span class="tag" lang="zh">中文</span>`,
  ].filter(Boolean).join("");
  return `<li class="reel${r.seen ? " seen" : ""}">
    <a class="thumb" href="${esc(r.url)}" target="_blank" rel="noopener" aria-label="Open reel by @${esc(r.owner)} on Instagram">
      ${r.thumb ? `<img src="${esc(r.thumb)}" alt="" width="96" height="120" loading="lazy">` : `<span class="noimg">No preview</span>`}
    </a>
    <div class="body">
      <p class="who">${own ? "" : `<a href="https://www.instagram.com/${esc(r.owner)}/" target="_blank" rel="noopener">@${esc(r.owner)}</a>`}<span><span class="num">${compact(r.views)}</span> views, ${ageText(r.age_days)}</span></p>
      ${r.caption ? `<p class="cap">${esc(r.caption)}</p>` : ""}
      <p class="audio">Audio: ${esc(r.audio)}</p>
      ${tags ? `<p class="tags">${tags}</p>` : ""}
    </div>
    <p class="score">${r.score != null ? `<span class="visually-hidden">Score </span>${r.score.toFixed(1)}<small aria-label="times their usual views">×</small>` : ""}</p>
    <div class="acts">
      <a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener">Watch</a>
      <a class="btn" href="${esc(calendarLink(r, nicheName))}" target="_blank" rel="noopener">Add to calendar</a>
    </div>
  </li>`;
}

function hiddenList(list) {
  if (!list || !list.length) return "";
  return `<details class="hidden">
    <summary>${plural(list.length, "reel", "reels")} hidden as an ad, event or life moment</summary>
    <table>
      <thead><tr><th>Why</th><th>Creator</th><th class="num">Score</th><th><span class="visually-hidden">Link</span></th></tr></thead>
      <tbody>${list.map(r => `<tr>
        <td>${esc(r.skip)}</td>
        <td><a href="https://www.instagram.com/${esc(r.owner)}/" target="_blank" rel="noopener">@${esc(r.owner)}</a></td>
        <td class="num">${r.score != null ? r.score.toFixed(1) + "×" : ""}</td>
        <td><a href="${esc(r.url)}" target="_blank" rel="noopener">Watch</a></td>
      </tr>`).join("")}</tbody>
    </table>
  </details>`;
}

function section(id, name, count, body, cls = "") {
  return `<section class="niche ${cls}" id="${id}" aria-labelledby="${id}-h">
    <div class="niche-head"><h2 id="${id}-h">${esc(name)}</h2>${count != null ? `<p>${plural(count, "reel", "reels")} to copy</p>` : ""}</div>
    ${body}
  </section>`;
}

function ledger(niches, own) {
  const ownRow = `<tr><td><a href="#his-reels">His reels</a></td><td class="num zero">${own ? own.reels.length : 0}</td><td></td></tr>`;
  const rows = ownRow + niches.map(n => {
    const k = n.reels.length, h = (n.hidden || []).length;
    return `<tr><td><a href="#${n.id}">${esc(n.name)}</a></td><td class="num${k ? "" : " zero"}">${k}</td><td class="num zero">${h}</td></tr>`;
  }).join("");
  const sum = f => niches.reduce((a, n) => a + f(n), 0);
  return `<table class="ledger">
    <caption>This week, niche by niche</caption>
    <thead><tr><th>Niche</th><th class="num">To copy</th><th class="num">Hidden</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td>All niches</td><td class="num">${sum(n => n.reels.length)}</td><td class="num">${sum(n => (n.hidden || []).length)}</td></tr></tfoot>
  </table>`;
}

function render(d) {
  const niches = d.niches || [];
  document.getElementById("week").textContent = d.generated
    ? `Week of ${sgDate(d.generated, { day: "numeric", month: "long", year: "numeric" })}`
    : "No reels yet";
  document.getElementById("status").textContent = d.status || "";
  if (d.checked) {
    const t = document.getElementById("checked");
    t.dateTime = d.checked;
    t.textContent = `Checked ${sgDate(d.checked, { day: "numeric", month: "short" })}`;
  }

  let html = "";
  if (d.generated) {
    const box = document.getElementById("ledger");
    box.innerHTML = ledger(niches, d.own);
    box.hidden = !niches.length;

    const own = d.own;
    let body;
    if (!own) body = `<p class="empty">Add his Instagram handle as own_account in config.json to see his reels here, scored the same way.</p>`;
    else if (!own.reels.length) body = `<p class="empty">No reels from @${esc(own.handle)} in the last 30 days.</p>`;
    else {
      const scored = own.reels.some(r => r.score != null);
      body = (scored ? "" : `<p class="empty">Scores appear once @${esc(own.handle)} has a few more reels to compare against.</p>`)
        + `<ul class="reels">${own.reels.map(r => reel(r, "His own", true)).join("")}</ul>`;
    }
    html += section("his-reels", "His reels", null, body, "own");
  }

  for (const n of niches) {
    const body = (n.reels.length
      ? `<ul class="reels">${n.reels.map(r => reel(r, n.name)).join("")}</ul>`
      : `<p class="empty">No reel he could copy got 2.5× its creator’s usual views this week.</p>`) + hiddenList(n.hidden);
    html += section(n.id, n.name, n.reels.length, body);
  }

  if (d.health && d.health.length) {
    const name = Object.fromEntries(niches.map(n => [n.id, n.name]));
    html += section("replace", "Accounts to replace", null,
      `<table><thead><tr><th>Creator</th><th class="hide-sm">Niche</th><th>Why</th></tr></thead><tbody>${d.health.map(h =>
        `<tr><td><a href="https://www.instagram.com/${esc(h.handle)}/" target="_blank" rel="noopener">@${esc(h.handle)}</a></td><td class="hide-sm">${esc(name[h.niche] || h.niche)}</td><td>${esc(h.reason)}</td></tr>`).join("")}</tbody></table>`,
      "replace");
  }

  if (!d.generated) {
    html += `<p class="empty">This page fills in after the first weekly run. The README covers setup: an Apify key, picking creators, then turning on the weekly run.</p>`;
  }
  document.getElementById("main").innerHTML = html;

  const s = d.spend;
  if (s) {
    const month = new Date(s.month + "-01T00:00:00").toLocaleDateString("en-SG", { month: "long" });
    const pct = Math.min(100, (s.usd / s.cap) * 100);
    document.getElementById("foot").innerHTML =
      `<p class="spend">Scraping spend in ${month}: <span class="num">$${s.usd.toFixed(2)}</span> of <span class="num">$${s.cap}</span></p><div class="meter" role="img" aria-label="${pct.toFixed(0)}% of budget used"><div style="width:${pct}%"></div></div>`
      + (d.generated ? `<p>Last run ${sgDate(d.generated, { weekday: "short", day: "numeric", month: "short" })}. ${d.curve_learned ? "Scores use growth patterns learned from these creators." : "Scores use a standard growth pattern until about 4 weeks of data come in."} The score is how many times its creator’s usual views a reel got by that age. Early means under 2 days old, so the score can still change. Reels whose captions read as an ad, an event or a life moment are hidden, since a spike from paid reach or a one-off occasion teaches no format; open the hidden list to check the call.</p>` : "");
  }
}

fetch("data.json", { cache: "no-store" })
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(render)
  .catch(() => {
    document.getElementById("week").textContent = "Couldn’t load this week’s data";
    document.getElementById("status").textContent = "data.json is missing or unreadable. Check the latest weekly run on GitHub, under Actions.";
  });
</script>
</body>
</html>
